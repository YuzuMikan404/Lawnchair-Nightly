name: Mirror Lawnchair Nightly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lawnchair-nightly-mirror
  cancel-in-progress: false

jobs:
  check-and-mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest Lawnchair nightly
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e

          response=""

          for i in 1 2 3 4 5; do
            response=$(gh api repos/LawnchairLauncher/lawnchair/releases/tags/nightly 2>&1)

            if [ $? -eq 0 ]; then
              break
            fi

            echo "::warning::Failed to fetch nightly (${i}/5): $response"
            response=""
            sleep 15
          done

          if [ -z "$response" ]; then
            echo "::warning::Unable to fetch Lawnchair nightly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set -e

          asset_name=$(echo "$response" | jq -r \
            '[.assets[] | select(.name | test("\\.apk$"))][0].name')

          asset_url=$(echo "$response" | jq -r \
            '[.assets[] | select(.name | test("\\.apk$"))][0].browser_download_url')

          digest=$(echo "$response" | jq -r \
            '[.assets[] | select(.name | test("\\.apk$"))][0].digest')

          commit=$(echo "$response" | jq -r '.target_commitish')
          release_url=$(echo "$response" | jq -r '.html_url')

          if [ -z "$asset_name" ] || [ "$asset_name" = "null" ]; then
            echo "::warning::No APK asset found."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "asset_url=$asset_url" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"

      - name: Check whether APK was already tested
        id: compare
        if: steps.latest.outputs.skip != 'true'
        run: |
          last_seen=""

          if [ -f state/last_seen_digest.txt ]; then
            last_seen=$(cat state/last_seen_digest.txt)
          fi

          if [ "$last_seen" = "${{ steps.latest.outputs.digest }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify baseline exists
        if: steps.compare.outputs.changed == 'true'
        run: |
          if [ ! -s state/last_good_tag.txt ]; then
            echo "::error::state/last_good_tag.txt does not exist."
            exit 1
          fi

      - name: Download candidate APK
        if: steps.compare.outputs.changed == 'true'
        run: |
          mkdir -p candidate

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 5 \
            --output "candidate/${{ steps.latest.outputs.asset_name }}" \
            "${{ steps.latest.outputs.asset_url }}"

      - name: Download last known-good APK
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(cat state/last_good_tag.txt)

          mkdir -p baseline

          gh release download "$tag" \
            --pattern "*.apk" \
            --dir baseline

          baseline_apk=$(find baseline -maxdepth 1 -name '*.apk' | head -n 1)

          if [ -z "$baseline_apk" ]; then
            echo "::error::Unable to find known-good APK."
            exit 1
          fi

      - name: Enable KVM
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test APK upgrade
        if: steps.compare.outputs.changed == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CANDIDATE_NAME: ${{ steps.latest.outputs.asset_name }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true

          emulator-options: >-
            -no-snapshot
            -no-window
            -no-audio
            -no-boot-anim
            -camera-back none

          script: bash ./scripts/smoke-test.sh

      - name: Upload diagnostics
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lawnchair-smoke-test-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            logcat.txt
            logcat-final.txt
            activity-processes.txt
            activity-activities.txt
            smoke-result.txt

      - name: Read test result
        id: result
        if: steps.compare.outputs.changed == 'true'
        run: |
          if [ -f smoke-result.txt ] &&
             grep -q '^passed$' smoke-result.txt; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        id: release
        if: >
          steps.compare.outputs.changed == 'true' &&
          steps.result.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          now_epoch=$(date -u +%s)

          ts=$(TZ='Asia/Tokyo' \
            date -d "@${now_epoch}" +"%Y%m%d-%H%M%S")

          ts_jst=$(TZ='Asia/Tokyo' \
            date -d "@${now_epoch}" +"%Y-%m-%d %H:%M:%S %Z")

          tag="nightly-${ts}"

          notes="Lawnchair の nightly リリースから自動ミラーしました。

          Android Emulator 上で、前回の正常版から
          このバージョンへのアップデートテストに成功しています。

          元のアセット: ${{ steps.latest.outputs.asset_name }}
          SHA256: ${{ steps.latest.outputs.digest }}
          元コミット: ${{ steps.latest.outputs.commit }}
          元リリース: ${{ steps.latest.outputs.release_url }}
          検知時刻(JST): ${ts_jst}"

          gh release create "$tag" \
            "candidate/${{ steps.latest.outputs.asset_name }}" \
            --title "Lawnchair Nightly Mirror ${ts}" \
            --notes "$notes"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Save state
        if: steps.compare.outputs.changed == 'true'
        run: |
          mkdir -p state

          echo "${{ steps.latest.outputs.digest }}" \
            > state/last_seen_digest.txt

          if [ "${{ steps.result.outputs.passed }}" = "true" ]; then
            echo "${{ steps.release.outputs.tag }}" \
              > state/last_good_tag.txt
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update nightly validation state [skip ci]"
          git push

      - name: Reject failed candidate
        if: >
          steps.compare.outputs.changed == 'true' &&
          steps.result.outputs.passed != 'true'
        run: |
          echo "::error::Candidate APK failed the smoke test."
          echo "::error::Release was NOT created."
          exit 1
